<script id="oddos-meta-consent">

var email=villa?'contact@villavalleyre.fr':'contact@lamaisonduparc-salles.fr';

var key='oddos_meta_consent_v2',maxAge=180*24*60*60*1000,choice=null,started=false,observed=false;

function allowed(){var c=read();return !!(c&&c.marketing);}
function clearMetaCookies(){['_fbp','_fbc'].forEach(function(n){var parts=location.hostname.split('.');document.cookie=n+'=;Max-Age=0;path=/;SameSite=Lax';for(var i=0;i<parts.length-1;i++){var d=parts.slice(i).join('.');document.cookie=n+'=;Max-Age=0;path=/;domain=.'+d+';SameSite=Lax';}});}
function event(name,data){if(started&&allowed())window.fbq('trackSingle',pixel,name,data||{});}
function start(){if(started||!allowed())return;started=true;
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
window.fbq('consent','grant');window.fbq('set','autoConfig',false,pixel);window.fbq('init',pixel);event('PageView');
if(/\/menus\/?$/.test(location.pathname))event('ViewContent',{content_name:'Menus',content_category:'Restaurant'});
if(!observed&&'IntersectionObserver' in window){observed=true;var obs=new IntersectionObserver(function(entries){entries.forEach(function(x){if(x.isIntersecting&&allowed()){event('ViewContent',{content_name:'Carte',content_category:'Restaurant'});obs.disconnect();}});},{threshold:0.15});var card=document.querySelector('#vv-carte,#lmp-carte');if(card)obs.observe(card);}
}
function stop(){if(started&&window.fbq){window.fbq('consent','revoke');if(window.fbq.queue)window.fbq.queue=[];}clearMetaCookies();}
function save(value,analytics){choice={version:2,analytics:analytics,marketing:value,date:Date.now()};try{localStorage.setItem(key,JSON.stringify(choice));}catch(e){panel.querySelector('[data-status]').textContent=en?'Your choice could not be saved. Advertising cookies remain disabled.':'Votre choix ne peut pas \u00eatre enregistr\u00e9. Les cookies publicitaires restent d\u00e9sactiv\u00e9s.';return;}panel.hidden=true;settings.focus();window.dispatchEvent(new Event('oddos-audience-consent'));if(value){if(started)window.fbq('consent','grant');else start();}else{stop();}}
var panel,settings;
function init(){if(document.getElementById('oddos-cookie-panel'))return;
panel=document.createElement('section');panel.id='oddos-cookie-panel';panel.setAttribute('role','region');panel.setAttribute('aria-label',en?'Cookie preferences':'Choix des cookies');
var title=en?'Let us put our cards on the table':'On joue cartes sur table';
var intro=en?"With your permission, we count visits to our website. Separately, Meta cookies help measure our ads. You can accept or refuse each purpose.":"Avec votre accord, nous comptons les visites de notre site. S\u00e9par\u00e9ment, les cookies Meta nous aident \u00e0 mesurer nos publicit\u00e9s. Vous pouvez accepter ou refuser chaque usage.";
var aggregateNotice=en?"\u003cp>An aggregate page counter also operates without cookies or individual identifiers, including when optional cookies are refused. Only daily totals per restaurant are stored for up to 400 days. It does not identify people or link browsing between sites. Hosting providers process technical requests under their own logging settings.\u003c/p>":"\u003cp>Un compteur global de pages fonctionne aussi sans cookie ni identifiant individuel, y compris si vous refusez les cookies facultatifs. Seuls des totaux quotidiens par restaurant sont conserv\u00e9s jusqu\u2019\u00e0 400 jours. Il ne reconna\u00eet pas les personnes et ne relie pas leur navigation entre les sites. Les h\u00e9bergeurs traitent les requ\u00eates techniques selon leurs param\u00e8tres de journalisation.\u003c/p>";
var audienceDetails=en?"\u003cp>\u003cstrong>Website audience: Maison Oddos.\u003c/strong> With your separate consent, a random identifier in sessionStorage counts visits and page views in our Pilotage tool (Supabase hosting). A session renews after 30 minutes of inactivity between page loads or at midnight Paris time. No IP address, form details or visited URL is recorded in our audience tables. Technical identifiers and event IDs are retained for up to 31 days; daily totals for up to 400 days, with cleanup on the next recorded visit. These are estimated sessions, not identified people.\u003c/p>":"\u003cp>\u003cstrong>Statistiques du site : Maison Oddos.\u003c/strong> Avec votre accord distinct, un identifiant al\u00e9atoire dans sessionStorage compte les visites et pages vues dans notre outil Pilotage (h\u00e9bergement Supabase). Une session est renouvel\u00e9e apr\u00e8s 30 minutes sans chargement de page ou \u00e0 minuit, heure de Paris. Aucune adresse IP, donn\u00e9e de formulaire ou URL visit\u00e9e n\u2019est enregistr\u00e9e dans nos tables d\u2019audience. Les identifiants techniques et \u00e9v\u00e9nements sont conserv\u00e9s jusqu\u2019\u00e0 31 jours, les totaux quotidiens jusqu\u2019\u00e0 400 jours, avec nettoyage lors de la visite suivante. Il s\u2019agit de sessions estim\u00e9es, pas de personnes identifi\u00e9es.\u003c/p>";
var details=en?'\u003cp>\u003cstrong>Advertising: Meta Platforms Ireland Limited.\u003c/strong> If you accept, Meta receives information about the pages visited, interactions, browser and device (including IP address and advertising identifiers). Meta may associate this activity with your account for advertising and measurement. We do not add your booking form details to pixel events.\u003c/p>\u003cp>Meta cookies may include _fbp and _fbc (up to 90 days). Your accept/refuse choice is stored only in this browser for 6 months. Use \u201cCookies\u201d at any time to change or withdraw consent; withdrawal stops future tracking and removes accessible Meta cookies on this site. It does not erase data already received by Meta.\u003c/p>':'\u003cp>\u003cstrong>Publicit\u00e9 : Meta Platforms Ireland Limited.\u003c/strong> En acceptant, Meta re\u00e7oit des informations sur les pages visit\u00e9es, les interactions, le navigateur et l\u2019appareil (notamment l\u2019adresse IP et des identifiants publicitaires). Meta peut rapprocher cette activit\u00e9 de votre compte pour la publicit\u00e9 et la mesure. Nous n\u2019ajoutons pas les donn\u00e9es de votre formulaire de r\u00e9servation aux \u00e9v\u00e9nements du pixel.\u003c/p>\u003cp>Les cookies Meta peuvent comprendre _fbp et _fbc (jusqu\u2019\u00e0 90 jours). Votre choix accepter/refuser est conserv\u00e9 dans ce navigateur pendant 6 mois. Le bouton \u00ab Cookies \u00bb permet de modifier ou retirer votre accord \u00e0 tout moment : le retrait arr\u00eate le suivi futur et supprime les cookies Meta accessibles sur ce site. Il n\u2019efface pas les donn\u00e9es d\u00e9j\u00e0 re\u00e7ues par Meta.\u003c/p>';
panel.innerHTML='\u003ch2>'+title+'\u003c/h2>\u003cp>'+intro+'\u003c/p>\u003cdiv class="oc-actions">\u003cbutton type="button" data-accept>'+(en?'Accept all':'Tout accepter')+'\u003c/button>\u003cbutton type="button" data-refuse>'+(en?'Refuse all':'Tout refuser')+'\u003c/button>\u003cbutton type="button" data-customize>'+(en?'Customize':'Personnaliser')+'\u003c/button>\u003c/div>\u003cdetails>\u003csummary>'+(en?'Details and privacy':'D\u00e9tails et confidentialit\u00e9')+'\u003c/summary>'+aggregateNotice+audienceDetails+details+'\u003cp>\u003ca href="mailto:'+email+'">'+email+'\u003c/a> \u00b7 \u003ca href="https://www.facebook.com/privacy/policy/" target="_blank" rel="noopener noreferrer">'+(en?'Meta privacy policy':'Confidentialit\u00e9 Meta')+'\u003c/a> \u00b7 \u003ca href="https://www.facebook.com/policies/cookies/" target="_blank" rel="noopener noreferrer">'+(en?'Meta cookies':'Cookies Meta')+'\u003c/a>\u003c/p>\u003clabel>\u003cinput type="checkbox" data-analytics>'+(en?'Website audience statistics':'Statistiques de fr\u00e9quentation du site')+'\u003c/label>\u003clabel>\u003cinput type="checkbox" data-marketing>'+(en?'Advertising cookies (Meta)':'Cookies publicitaires (Meta)')+'\u003c/label>\u003cbutton type="button" data-save>'+(en?'Save my choices':'Enregistrer mes choix')+'\u003c/button>\u003c/details>\u003cp data-status role="status">\u003c/p>';
settings=document.createElement('button');settings.type='button';settings.id='oddos-cookie-settings';settings.textContent='Cookies';settings.setAttribute('aria-label',en?'Change cookie preferences':'Modifier mes choix de cookies');settings.setAttribute('aria-controls','oddos-cookie-panel');settings.addEventListener('click',function(){panel.hidden=false;panel.querySelector('[data-refuse]').focus();});
document.body.append(panel,settings);panel.querySelector('[data-customize]').addEventListener('click',function(){var d=panel.querySelector('details');d.open=!d.open;panel.querySelector('[data-marketing]').checked=allowed();var current=read();panel.querySelector('[data-analytics]').checked=!!(current&&current.analytics);if(d.open)panel.querySelector('[data-marketing]').focus();});panel.querySelector('[data-save]').addEventListener('click',function(){save(panel.querySelector('[data-marketing]').checked,panel.querySelector('[data-analytics]').checked);});panel.querySelector('[data-refuse]').addEventListener('click',function(){save(false,false);});panel.querySelector('[data-accept]').addEventListener('click',function(){save(true,true);});choice=read();panel.hidden=!!choice;if(choice&&choice.marketing)start();else clearMetaCookies();
document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(!a||a.closest('#oddos-cookie-panel')||!allowed())return;var href=a.getAttribute('href')||'';if(/^tel:/i.test(href))event('Contact',{content_name:'Clic telephone'});else if(/^mailto:/i.test(href))event('Contact',{content_name:'Clic email'});else if(/reservations?\/?(?:[?#]|$)/i.test(href))event('Contact',{content_name:'Clic reservation'});else if(/#(?:vv-menu|vv-tous-menus)|\/menus(?:[?#]|$)|menu-\d+/i.test(href))event('ViewContent',{content_name:'Menus',content_category:'Restaurant'});});
setInterval(function(){if(started&&!allowed())stop();},60000);
window.addEventListener('storage',function(e){if(e.key!==key)return;choice=read();if(choice&&choice.marketing){if(started)window.fbq('consent','grant');else start();}else stop();panel.hidden=!!choice;});
}

})();

<script id="oddos-website-audience">
(function(){
 'use strict';
 if(window.oddosAudienceInstalled)return;window.oddosAudienceInstalled=true;
 var key='oddos_audience_session_v1',sent=false;
 function accepted(){try{var c=JSON.parse(localStorage.getItem('oddos_meta_consent_v2'));return c&&c.version===2&&c.analytics===true&&c.date<=Date.now()&&Date.now()-c.date<15552000000;}catch(e){return false;}}
 function record(){if(sent||!accepted()||document.visibilityState!=='visible'||location.search.indexOf('elementor-preview=')!==-1||location.pathname.indexOf('/wp-admin')===0)return;
  try{var now=Date.now(),day=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());var session=JSON.parse(sessionStorage.getItem(key)||'null');if(!session||session.day!==day||now-session.last>1800000)session={id:crypto.randomUUID(),day:day};session.last=now;sessionStorage.setItem(key,JSON.stringify(session));sent=true;
  fetch('https://pilotage.oddos.eu/api/site-visits',{method:'POST',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'text/plain'},body:JSON.stringify({consent:true,session_id:session.id,event_id:crypto.randomUUID()}),keepalive:true}).catch(function(){});
  }catch(e){}
 }
 function change(){if(accepted())record();else{try{sessionStorage.removeItem(key);}catch(e){}}}
 window.addEventListener('oddos-audience-consent',change);window.addEventListener('storage',change);document.addEventListener('visibilitychange',record);change();
})();
</script>
